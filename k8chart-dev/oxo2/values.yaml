imageTag: "dev"

# The path the whole stack is served under, without a trailing slash. Single source for the ingress
# routes, the frontend's OXO_PUBLIC_URL and the backend's servlet context path, which have to agree:
# the frontend builds its API and Swagger links from OXO_PUBLIC_URL, and the ingress has to route
# those same paths to the backend. A deployment on a different path changes this one key.
#
# It must be a sub-path. Serving at the root would need the ingress prefix and OXO_PUBLIC_URL to
# diverge — an empty prefix but a literal "/" for the frontend, which treats "" as "no public URL
# set" and falls back to OXO_BACKEND_URL. k8chart-local is root-served and does not use this key.
basePath: /oxo2

solr:
  replicaCount: 1
  # Explicit heap: without SOLR_HEAP the Solr launcher defaults to 512m, which cannot serve
  # grouping/collapse queries on the full index (and OOM-killed the HPC dataload Solr at dev
  # scale). The container memory sizes leave the heap headroom for JVM overhead; the OS page
  # cache the index relies on is reclaimable, so the limit does not need to cover the index.
  heap: 4g
  resources:
    requests:
      cpu: 1
      memory: 5Gi
    limits:
      memory: 8Gi
  service:
    port: 8983
    containerPort: 8983
    targetPort: 8983  
  persistence:
    enabled: true
    size: 200Gi

backend:
  image: "oxo2/backend"
  replicaCount: 1
  service:
    port: 8080
    containerPort: 8081
    targetPort: 8081
    

frontend:
  image: "oxo2/frontend"
  replicaCount: 1
  service:
    port: 8080
    containerPort: 8080
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 4Gi
