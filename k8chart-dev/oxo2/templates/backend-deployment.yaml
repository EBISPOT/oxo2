apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ebispot/oxo2-backend:{{.Values.imageTag}}
          imagePullPolicy: Always
          env:
            - name: OXO2_SOLR_HOST
              value: "http://{{ .Release.Name }}-solr:{{ .Values.solr.service.port }}/solr"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: {{ include "oxo2.basePath" . | quote }}
          ports:
            - containerPort: {{ .Values.backend.service.containerPort }}