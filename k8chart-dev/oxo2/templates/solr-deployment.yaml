apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-solr
spec:
  replicas: {{ .Values.solr.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-solr
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-solr
    spec:
      securityContext:
        fsGroup: 8389
        runAsUser: 8389
        runAsGroup: 8389
        runAsNonRoot: true  
      initContainers:
        - name: import-solr-data
          image: busybox
          command:
            - sh
            - -c
            - |
              if [ -d /import ] && [ -z "$(ls -A /var/solr 2>/dev/null)" ]; then
                echo "Copying import volume into Solr data..."
                cp -a /import/. /var/solr/
              else
                echo "Skipping copy (import missing or Solr dir not empty)"
              fi
          volumeMounts:
            - name: solr-data
              mountPath: /var/solr
            - name: import-data
              mountPath: /import
              readOnly: true              
      containers:
        - name: solr
          image: {{ .Values.solr.image | quote }}
          env:
            - name: SOLR_HOME
              value: /var/solr
            - name: SOLR_JETTY_HOST
              value: "0.0.0.0"
            - name: SOLR_SECURITY_MANAGER_ENABLED
              value: "false"
          ports:
            - containerPort: {{ .Values.solr.service.containerPort }}
          volumeMounts:
            - name: solr-data
              mountPath: /var/solr
      volumes:
        - name: solr-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-solr-pvc
        - name: import-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-import-pvc
          
