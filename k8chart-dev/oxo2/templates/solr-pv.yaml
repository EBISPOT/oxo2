apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "oxo2.fullname" . }}-solr-pv
  namespace: {{ .Release.Namespace }}
spec:
  capacity:
    storage: {{ .Values.solr.persistence.size }}
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/solr-data
  {{- if .Values.solr.persistence.nodeAffinity.host }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.solr.persistence.nodeAffinity.host | quote }}
  {{- end }}
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ include "oxo2.fullname" . }}-solr-pvc