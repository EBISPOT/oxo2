name=oxo2-entities
# Schemaless mode OFF (ADR-0034). oxo2-entities exists in order to have a deliberate schema — the
# edge-n-gram fields with their specific analyzers, and nothing else. Solr's stock
# add-unknown-fields-to-the-schema chain is on by default; with it on, a typo'd field name in the
# dataload JSON would be silently accepted as a brand-new field instead of failing, and the typeahead
# would just quietly stop matching on the field that was meant. Reject unknown fields instead.
update.autoCreateFields=false
