services:
  solr:
    build:
      context: .
      dockerfile: Dockerfile.solr
    volumes:
      # Mount configsets for both cores
      - ./solr-config/oxo2-mappings:/opt/solr/server/solr/configsets/oxo2-mappings:ro
      - ./solr-config/oxo2-mappingsets:/opt/solr/server/solr/configsets/oxo2-mappingsets:ro
      - oxo-solr-data:/opt/solr/server/solr:rw
    ports:
      - 8983:8983
    command:
      # Create both cores with their respective configsets
      - /bin/bash
      - -c
      - |
        solr-precreate oxo2-mappings /opt/solr/server/solr/configsets/oxo2-mappings &
        solr-precreate oxo2-mappingsets /opt/solr/server/solr/configsets/oxo2-mappingsets &
        exec solr --user-managed -f
  oxo2-dataload:
    environment:
      - JAVA_OPTS=${JAVA_OPTS}
    build:
      context: .
      dockerfile: Dockerfile.dataload
    user: "1000:1000"
    volumes:
      - oxo-solr-data:/opt/solr/server:rw
      - ./${OXO_CONFIG:?OXO2 dataload requires a config file}:/mnt/config/${OXO_CONFIG}:ro
      - oxo:/opt/oxo:rw
      - maven-repo:/root/.m2/repository:rw
    depends_on:
      solr:
        condition: service_completed_successfully
volumes:
  maven-repo:
  oxo:
  oxo-solr-data:
