solr.url=http://localhost:8983/solr
connectionTimeoutMillis=10000
socketTimeoutMillis=60000

spring.mvc.log-request-details=true
server.port=8081

# Honour X-Forwarded-* so the SSSOM-API (ADR-0032) previous/next links are built with the external
# scheme/host/port the client used, not the pod-internal address, behind the k8s ingress.
server.forward-headers-strategy=framework

# OpenAPI / Swagger UI (springdoc).
#   Spec: http://localhost:8081/v3/api-docs   UI: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha