name: Publish software release

# The release job of ADR-0052: called by stable.yml once the checks on a push to stable have
# passed. It never runs on its own trigger. Every step is idempotent and keyed on the release
# state .github/release/release.py keeps in the GitHub release body, so recovery from any
# failure is "re-run the failed jobs of the original run", never "make another release".
#
# Only this job may move the :stable image aliases (docker.yml stops at dev). They move last,
# by digest, and only if stable still points at this commit — so :stable is never a mixed set
# of images from different commits and an old re-run can never move it backwards.

on:
  workflow_call:

permissions:
  contents: write
  packages: write

env:
  COMPONENTS: dataload nextflow backend frontend solr

jobs:
  release:
    if: github.repository == 'EBISPOT/oxo2' && github.event_name == 'push' && github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # Full history: prepare checks ancestry against origin/stable and the notes generator
          # walks the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare or recover the release
        id: prepare
        run: python .github/release/release.py prepare

      - name: Tag, publish, and wait for the Zenodo DOI
        run: python .github/release/release.py archive

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build versioned multi-platform images and record their digests
        if: steps.prepare.outputs.complete != 'true'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # The archive step wrote oxo2-release.json into the backend, frontend and dataload trees,
          # so the images built here carry the manifest of the release they belong to.
          for component in $COMPONENTS; do
            if [ -f ".release-output/image-${component}.json" ]; then
              echo "Reusing completed ${component} image"
              continue
            fi
            context=.
            case "$component" in
              dataload) dockerfile=./oxo2-dataload/Dockerfile.dataload ;;
              nextflow) dockerfile=./oxo2-dataload/Dockerfile.nextflow ;;
              backend)  dockerfile=./oxo2-backend/Dockerfile.backend ;;
              frontend) dockerfile=./oxo2-frontend/Dockerfile.frontend; context=./oxo2-frontend ;;
              solr)     dockerfile=./oxo2-dataload/Dockerfile.solr ;;
            esac
            docker buildx build "$context" --file "$dockerfile" \
              --platform linux/amd64,linux/arm64 --push \
              --tag "ghcr.io/ebispot/oxo2-${component}:${RELEASE_TAG}" \
              --label "org.opencontainers.image.version=${RELEASE_VERSION}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --cache-from "type=registry,ref=ghcr.io/ebispot/oxo2-${component}:release-buildcache" \
              --cache-to "type=registry,mode=max,ref=ghcr.io/ebispot/oxo2-${component}:release-buildcache" \
              --metadata-file ".release-output/build-${component}.json"
            python .github/release/release.py remember-image --component "$component" \
              --metadata ".release-output/build-${component}.json"
          done

      - name: Finish the release with the manifest and source tarball
        run: python .github/release/release.py finish

      - name: Promote the recorded digests to :stable
        run: |
          set -euo pipefail
          git fetch origin stable
          latest=$(git rev-parse origin/stable)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "stable has advanced past this commit; the versioned release stands and :stable is left to the newer run"
            exit 0
          fi
          for component in $COMPONENTS; do
            image=$(python -c 'import json,sys; print(json.load(open(".release-output/release-manifest.json"))["images"][sys.argv[1]])' "$component")
            docker buildx imagetools create --tag "ghcr.io/ebispot/oxo2-${component}:stable" "$image"
          done

      - name: Release summary
        if: success()
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment and the HPC data release are separate actions (docs/releases.md)." >> "$GITHUB_STEP_SUMMARY"
