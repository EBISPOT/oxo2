name: Build and push OxO2 images

on:
  push:
    # dev only. A push to stable is a software release (ADR-0052): stable.yml runs the checks
    # and release.yml builds the versioned images and is the ONLY thing that moves the mutable
    # :stable tags the production HPC dataload and clusters pull (ADR-0050) — after all five
    # versioned images exist, so :stable is never a mixed set.
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    if: ${{ github.repository_owner == 'EBISPOT' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: oxo2-dataload
            dockerfile: ./oxo2-dataload/Dockerfile.dataload
            context: .
          - image: oxo2-nextflow
            dockerfile: ./oxo2-dataload/Dockerfile.nextflow
            context: .
          - image: oxo2-backend
            dockerfile: ./oxo2-backend/Dockerfile.backend
            context: .
          - image: oxo2-frontend
            dockerfile: ./oxo2-frontend/Dockerfile.frontend
            context: ./oxo2-frontend
          - image: oxo2-solr
            dockerfile: ./oxo2-dataload/Dockerfile.solr
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image-tags
        shell: bash
        run: |
          # Branch names are not safe image aliases: a stable -> dev PR used to overwrite
          # :stable with development builds. Only release.yml may publish release aliases.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/dev" ]]; then
            ref_tag="dev"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_REF" =~ ^refs/pull/([0-9]+)/merge$ ]]; then
            ref_tag="pr-${BASH_REMATCH[1]}"
          else
            echo "Unsupported image publication event/ref: $GITHUB_EVENT_NAME $GITHUB_REF" >&2
            exit 1
          fi

          echo "ref_tag=$ref_tag" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/ebispot/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/ebispot/${{ matrix.image }}:${{ steps.image-tags.outputs.ref_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
