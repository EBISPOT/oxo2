name: Build and push OxO2 images

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    if: ${{ github.repository_owner == 'EBISPOT' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: oxo2-dataload
            dockerfile: ./oxo2-dataload/Dockerfile.dataload
            context: .
          - image: oxo2-nextflow
            dockerfile: ./oxo2-dataload/Dockerfile.nextflow
            context: .
          - image: oxo2-backend
            dockerfile: ./oxo2-backend/Dockerfile.backend
            context: .
          - image: oxo2-frontend
            dockerfile: ./oxo2-frontend/Dockerfile.frontend
            context: ./oxo2-frontend
          - image: oxo2-solr
            dockerfile: ./oxo2-dataload/Dockerfile.solr
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image-tags
        shell: bash
        run: |
          raw_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          ref_tag="$(printf '%s' "$raw_ref" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"
          ref_tag="${ref_tag:0:128}"

          if [[ -z "$ref_tag" ]]; then
            ref_tag="ref-${GITHUB_SHA::12}"
          fi

          echo "ref_tag=$ref_tag" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/ebispot/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/ebispot/${{ matrix.image }}:${{ steps.image-tags.outputs.ref_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
