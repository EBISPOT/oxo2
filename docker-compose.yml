services:
  build:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - build-artefacts:/opt/oxo:rw
      - ${M2_VOLUME}:/root/.m2/repository:rw
  dataload:
    build:
      context: .
      dockerfile: ./oxo2-dataload/dataload.Dockerfile
      additional_contexts:
        oxo2-build: "service:build"
    environment:
      - OXO2_CONFIG=/mnt/config/${OXO2_CONFIG}
    volumes:
      - build-artefacts:/opt/oxo:rw
      - ./${OXO2_CONFIG:?OXO dataload requires a config file}:/mnt/config/${OXO2_CONFIG}:ro
      - data:/tmp/data:rw
      - solr-data:/opt/solr/server/solr/configsets:rw
volumes:
  build-artefacts:
  data:
  solr-data:

