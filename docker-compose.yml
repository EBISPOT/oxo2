services:
  dataload:
    build:
      context: .
      dockerfile: ./oxo2-dataload/Dockerfile.dataload
    environment:
      - OXO2_CONFIG=/mnt/oxo/configs/config.json
      - SOLR_HOME=/opt/solr/server/solr
      - SOLR_SCRIPT=/opt/solr/bin
    volumes:
      - data:/mnt/oxo/data:rw
      - solr-data:/opt/solr/server/solr:rw
      - logs:/mnt/oxo/logs:rw
      - ${OXO2_CONFIG:-./oxo-config.json}:/mnt/oxo/configs/config.json:ro
  solr:
    build:
      context: .
      dockerfile: ./oxo2-dataload/Dockerfile.solr
    image: oxo2-solr:10.0.0-slim-java25
    environment:
      - SOLR_HOME=/mnt/oxo/solr-data
      - SOLR_JETTY_HOST=0.0.0.0
      - SOLR_SECURITY_MANAGER_ENABLED=false
    ports:
      - 8983:8983
    volumes:
      - solr-data:/mnt/oxo/solr-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8983/solr/oxo2-mappings/select?q=*:*&rows=0' >/dev/null && curl -fsS 'http://localhost:8983/solr/oxo2-mappingsets/select?q=*:*&rows=0' >/dev/null && curl -fsS 'http://localhost:8983/solr/oxo2-entities/select?q=*:*&rows=0' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    depends_on:
      dataload:
        condition: service_completed_successfully
  backend:
    build:
      context: .
      dockerfile: ./oxo2-backend/Dockerfile.backend
    ports:
      - 8081:8081
    environment:
      - OXO2_SOLR_HOST=http://solr:8983/solr
    depends_on:
      solr:
        condition: service_healthy
    links:
      - solr
  frontend:
    build:
      context: ./oxo2-frontend
      dockerfile: ./Dockerfile.frontend
      args:
        BACKEND_API_URL: http://localhost:8081
    env_file: ./oxo2-frontend/.env.production
    environment:
      - OXO_BACKEND_URL=http://localhost:8081
      - OXO_PUBLIC_URL=/
    ports:
      - 8080:8080
    depends_on:
      - backend
    links:
      - backend
volumes:
  data:
  solr-data:
  logs:
