services:
  dataload:
    build:
      context: .
      dockerfile: ./oxo2-dataload/dataload.Dockerfile
      args:
        OXO2_CONFIG: ${OXO2_CONFIG}
    environment:
      - ${OXO2_CONFIG}=/opt/oxo/config.json
      - SOLR_HOME=/opt/solr/server/solr
      - SOLR_SCRIPT=/opt/solr/bin
    volumes:
      - build:/opt/oxo:rw
      - data:/tmp/data:rw
      - solr-data:/opt/solr/server/solr:rw
      - logs:/tmp/logs:rw
  solr:
    image: solr:9.9.0
    environment:
      - SOLR_HOME=/mnt/solr-data
    ports:
      - 8983:8983
    volumes:
      - solr-data:/mnt/solr-data
    depends_on:
      dataload:
        condition: service_completed_successfully
  backend:
    build:
      context: .
      dockerfile: ./oxo2-backend/backend.Dockerfile
    ports:
      - 8080:8080
    environment:
      - OXO2_SOLR_HOST=http://solr:8983/solr
    depends_on:
      - solr
    links:
      - solr
  frontend:
    build:
      context: ./oxo2-frontend
      dockerfile: ./frontend.Dockerfile
      args:
        BACKEND_API_URL: http://backend:8080
    env_file: ./oxo2-frontend/.env.production
    ports:
      - 8081:8080
    depends_on:
      - backend
    links:
      - backend
volumes:
  build:
  data:
  solr-data:
  logs:

