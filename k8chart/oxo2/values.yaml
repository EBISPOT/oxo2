# Production chart. The SAME chart and values deploy to both the production and the failover
# Kubernetes clusters (ADR-0050: both serve the same solr-data.tar.gz release). Anything that
# differs between the two clusters is deliberately NOT in this file and is injected at deploy
# time by the Jenkins job for that cluster:
#
#   nfs_host, nfs_path                      — the NFS export holding solr-data.tar.gz
#   solr.persistence.nodeSelectorHostnames  — the node(s) with the local Solr disk
#   frontend.backendUrl                     — the backend URL the frontend calls
#
# The :stable images are published by CI on every push to the stable branch — a release act,
# never routine (ADR-0050). The tag is mutable, so every deployment pulls with
# imagePullPolicy: Always.
imageTag: "stable"

# The path the whole stack is served under, without a trailing slash. Single source for the ingress
# routes, the frontend's OXO_PUBLIC_URL and the backend's servlet context path, which have to agree:
# the frontend builds its API and Swagger links from OXO_PUBLIC_URL, and the ingress has to route
# those same paths to the backend. A deployment on a different path changes this one key.
#
# It must be a sub-path. Serving at the root would need the ingress prefix and OXO_PUBLIC_URL to
# diverge — an empty prefix but a literal "/" for the frontend, which treats "" as "no public URL
# set" and falls back to OXO_BACKEND_URL. k8chart-local is root-served and does not use this key.
basePath: /spot/oxo

solr:
  replicaCount: 1
  # Explicit heap: without SOLR_HEAP the Solr launcher defaults to 512m, which cannot serve
  # grouping/collapse queries on the full index (and OOM-killed the HPC dataload Solr at dev
  # scale).
  heap: 4g
  # Memory: the launcher pre-touches the whole heap (-Xms = -Xmx, AlwaysPreTouch), so resident
  # memory sits at heap + ~0.4Gi from the first minute. Everything above that is the OS page cache
  # for the index, which grows until the container reaches its limit and is reclaimable, so the
  # limit does not need to cover the index. The request covers the working set observed in
  # production (up to ~7Gi), so Solr is not running above its request and first in line for
  # eviction; the limit leaves ~7.5Gi of page cache.
  # CPU: Solr idles near zero but query bursts run at 2-4 cores for tens of minutes. The request
  # reserves 2 cores for such a burst should the node become contended; there is deliberately no
  # CPU limit, so a burst can use whatever the node has spare instead of being throttled.
  resources:
    requests:
      cpu: 2
      memory: 8Gi
    limits:
      memory: 12Gi
  service:
    port: 8983
    containerPort: 8983
    targetPort: 8983
  persistence:
    enabled: true
    size: 200Gi

backend:
  image: "oxo2/backend"
  replicaCount: 1
  service:
    port: 8080
    containerPort: 8081
    targetPort: 8081


frontend:
  image: "oxo2/frontend"
  replicaCount: 1
  service:
    port: 8080
    containerPort: 8080
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 4Gi
